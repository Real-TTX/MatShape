# MatShape - Development (branch dev, image :nightly) with pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:3939
#   pgAdmin: http://localhost:3940   (no sign-in; database password: matshape)
name: matshape-dev

services:
  web:
    image: ghcr.io/real-ttx/matshape:nightly
    restart: unless-stopped
    ports:
      - "3939:3939"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matshape
      POSTGRES_USER: matshape
      POSTGRES_PASSWORD: matshape
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matshape -d matshape"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "3940:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matshape.example.com
      PGADMIN_DEFAULT_PASSWORD: matshape
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatShape", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matshape", "Username": "matshape", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
