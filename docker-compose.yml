# MatShape - Release (branch main, image :latest)
#   docker compose up -d        ->  http://localhost:3939
# The first account that registers is the administrator. MatIdentity and MatSMTP are switched on by Mattiverse (see README).
name: matshape

services:
  web:
    image: ghcr.io/real-ttx/matshape:latest
    restart: unless-stopped
    ports:
      - "3939:3939"
    volumes:
      - web-data:/data
    # Optional, none of them is needed (README "Settings that matter"); Mattiverse sets them when it installs MatShape:
    # environment:
    #   MAT_API_KEY: ""                    # the key of /api/* (platform contract)
    #   MAT_PUBLIC_URL: ""                 # https://cad.example.com: the public address (fixed on Administration -> System while set)
    #   MAT_FRAME_ANCESTORS: ""            # origins that may show MatShape in a frame (Mattiverse)
    #   MATIDENTITY_AUTHORITY: ""          # https://id.example.com: sign-in through MatIdentity
    #   MATIDENTITY_CLIENT_ID: "matshape"
    #   MATIDENTITY_CLIENT_SECRET: ""
    #   MATIDENTITY_INTERNAL_URL: ""       # http://matidentity:2300 inside Docker
    #   MATSMTP_HOST: ""                   # mail through MatSMTP ("a document was shared with you")
    #   MATSMTP_PORT: "2025"
    #   MATSMTP_USERNAME: ""
    #   MATSMTP_PASSWORD: ""
    #   MATSMTP_FROM: ""                   # matshape@example.com
    #   MATSMTP_TLS: "none"                # none, starttls or tls
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matshape
      POSTGRES_USER: matshape
      POSTGRES_PASSWORD: matshape
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matshape -d matshape"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  web-data:
  db-data:
